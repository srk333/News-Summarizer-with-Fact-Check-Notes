<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NewsLens AI - Intelligent News Analysis</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="analyze">
    <div class="bg-glow" aria-hidden="true"></div>
    <div id="app-header"></div>

    <main class="wrap">
      <section class="hero">
        <span class="badge"><i class="dot"></i> Intelligent News Analysis</span>
        <h1>
          Understand the News.<br /><span class="grad"
            >Beyond the Headlines.</span
          >
        </h1>
        <p class="lead">
          AI-powered insights that help you uncover misinformation, check claims
          against live sources and understand the real story.
        </p>
      </section>

      <section class="card workspace">
        <div class="tabs" role="tablist">
          <button
            type="button"
            class="tab active"
            id="tab-url"
            role="tab"
            onclick="switchTab('url')"
          >
            Article URL
          </button>
          <button
            type="button"
            class="tab"
            id="tab-text"
            role="tab"
            onclick="switchTab('text')"
          >
            Paste Text
          </button>
        </div>

        <form
          id="url-form"
          autocomplete="off"
          novalidate
          onsubmit="analyzeArticle(event)"
        >
          <div class="input-icon">
            <svg
              viewBox="0 0 24 24"
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" />
              <path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" />
            </svg>
            <input
              type="url"
              id="article-url"
              name="articleUrl"
              autocomplete="off"
              inputmode="url"
              placeholder="https://example.com/news/article"
              class="field"
            />
          </div>
        </form>

        <div id="text-panel" class="hidden">
          <textarea
            id="article-text"
            name="articleBody"
            autocomplete="off"
            rows="8"
            class="field"
            placeholder="Paste the full article text here..."
            oninput="updateCount()"
          ></textarea>
          <div class="count" id="char-count">0 characters</div>
        </div>

        <div id="error-message" class="error hidden" role="alert"></div>

        <div class="actions">
          <button
            id="analyze-btn"
            type="button"
            class="btn btn-primary"
            onclick="analyzeArticle()"
          >
            Analyze Article
          </button>
          <button type="button" class="btn btn-ghost" onclick="clearInput()">
            Clear
          </button>
          <button type="button" class="btn btn-ghost" onclick="loadExample()">
            Example article
          </button>
          <button type="button" class="btn btn-ghost" onclick="runDemoMode()">
            Demo mode
          </button>
        </div>
        <p id="save-hint" class="hint"></p>

        <div id="loading" class="loading hidden">
          <div class="bar"><i id="bar-fill"></i></div>
          <p id="stage-text">Starting analysis...</p>
          <p class="hint">Fact-checking can take up to a minute.</p>
        </div>
      </section>

      <section id="results" class="hidden"></section>
    </main>

    <div id="toasts"></div>
    <script src="js/app.js"></script>
  </body>
</html>
