<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>History - NewsLens AI</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <h1 class="logo">NewsLens <span>AI</span></h1>
            <nav class="nav">
                <a href="index.html">Analyze News</a>
                <a href="history.html" class="active">History</a>
                <a href="about.html">About</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <section class="card">
            <h2>Analysis History</h2>
            <p>View previously analyzed articles and their fact-check notes.</p>
            
            <div id="error-message" class="error hidden"></div>
            
            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Loading history...</p>
            </div>

            <div class="table-container">
                <table class="history-table" id="history-table">
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Article Title</th>
                            <th>Source</th>
                            <th>Claims Analyzed</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <!-- History rows will go here -->
                    </tbody>
                </table>
            </div>
            
            <div id="no-history" class="hidden" style="text-align: center; padding: 2rem;">
                <p>No history found. Go analyze some news!</p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', loadHistory);
    </script>
</body>
</html>
